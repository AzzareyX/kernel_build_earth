name: Build Redmi 12C Kernel (LineageOS 23.2 - BakaSU & SUSFS Inline Hook)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lineage-23.2

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential libncurses5-dev bison flex libssl-dev bc dwarves \
            libelf-dev libyaml-dev zip unzip python3 git patch curl

      - name: Setup Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Kernel Source (LineageOS 23.2)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_earth.git -b lineage-23.2 kernel

      - name: Setup BakaSU & SUSFS (Inline Hook with Smart Resolution)
        run: |
          cd kernel
          
          # 1. Integrate BakaSU with Safe Kconfig Check
          echo "==> Cloning BakaSU..."
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git drivers/kernelsu
          
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "Searching for Kconfig inside drivers/kernelsu..."
            FOUND_KCONFIG=$(find drivers/kernelsu -maxdepth 2 -name "Kconfig" | head -n 1)
            if [ -f "$FOUND_KCONFIG" ]; then
              cp "$FOUND_KCONFIG" drivers/kernelsu/Kconfig
              echo "Copied Kconfig to drivers/kernelsu/Kconfig"
            else
              echo "Creating fallback drivers/kernelsu/Kconfig..."
              cat << 'EOF' > drivers/kernelsu/Kconfig
config KSU
	bool "KernelSU support"
	default y
EOF
            fi
          fi
          
          if ! grep -q "drivers/kernelsu" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

          # 2. Integrate SUSFS Patches with Multi-Mirror & Zip Fallback
          echo "==> Downloading SUSFS Patches..."
          mkdir -p susfs_src
          
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs_src 2>/dev/null || \
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git susfs_src 2>/dev/null || \
          {
            echo "Git clone failed, downloading archive via curl..."
            curl -L -o susfs.zip https://gitlab.com/simonpunk/susfs4ksu/-/archive/kernel-4.19/susfs4ksu-kernel-4.19.zip || \
            curl -L -o susfs.zip https://github.com/simonpunk/susfs4ksu/archive/refs/heads/kernel-4.19.zip
            unzip -q susfs.zip
            rm -rf susfs_src
            mv susfs4ksu-* susfs_src
          }
          
          echo "==> Locating and copying SUSFS files dynamically..."
          SUSFS_H=$(find susfs_src -type f -name "susfs.h" | grep -v ".git" | head -n 1)
          
          if [ -f "$SUSFS_H" ]; then
            SUSFS_DIR=$(dirname "$SUSFS_H")
            echo "Found susfs source directory at: $SUSFS_DIR"
            
            mkdir -p fs/susfs
            cp -r "$SUSFS_DIR"/* fs/susfs/
            cp "$SUSFS_H" include/linux/
            echo "Successfully copied SUSFS files and header!"
          else
            echo "Error: susfs.h not found anywhere in susfs_src!"
            find susfs_src -maxdepth 3
            exit 1
          fi
          
          PATCH_FILE=$(find susfs_src -name "*.patch" | head -n 1)
          if [ -n "$PATCH_FILE" ]; then
            echo "==> Applying patch: $PATCH_FILE"
            patch -p1 < "$PATCH_FILE" || true
          else
            echo "Warning: No patch file found, skipping patch step."
          fi

      - name: Setup Clang Toolchain (AOSP Clang Stable)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-14.0.0_r1 target-clang

      - name: Configure Defconfig & Enable BakaSU + SUSFS Inline Hook
        run: |
          cd kernel
          
          CLANG_DIR="$GITHUB_WORKSPACE/target-clang"
          export PATH="$CLANG_DIR/clang-r416183b/bin:$PATH"
          
          make O=out ARCH=arm64 earth_defconfig
          
          cat << 'EOF' >> out/.config
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_OPEN=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          EOF
          
          make O=out ARCH=arm64 CC=clang LD=ld.lld olddefconfig

      - name: Compile Kernel
        run: |
          cd kernel
          
          CLANG_DIR="$GITHUB_WORKSPACE/target-clang"
          export PATH="$CLANG_DIR/clang-r416183b/bin:$PATH"
          
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: Package Kernel with AnyKernel3
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osm0sis/AnyKernel3.git anykernel
          
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img anykernel/
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi
          
          cd anykernel
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Redmi 12C Lineage 23.2 (BakaSU + SUSFS Inline)
          do.devicecheck=1
          device.name1=earth
          device.name2=aether
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          
          zip -r9 ../Redmi12C-Kernel-Lineage23.2-BakaSU-SUSFS.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-Kernel-Lineage23.2-BakaSU-SUSFS
          path: Redmi12C-Kernel-Lineage23.2-BakaSU-SUSFS.zip
