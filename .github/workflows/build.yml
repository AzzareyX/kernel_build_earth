name: Build Redmi 12C Kernel (KernelSU Next v3.2.0-legacy + SUSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lineage-23.2

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential libncurses5-dev bison flex libssl-dev bc dwarves \
            libelf-dev libyaml-dev zip unzip python3 git curl patch

      - name: Setup Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Kernel Source (LineageOS 23.2)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_earth.git -b lineage-23.2 kernel

      - name: Setup Clang Toolchain (AOSP Clang Stable)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-14.0.0_r1 target-clang

      - name: Integrate KernelSU Next (v3.2.0-legacy) & SUSFS
        run: |
          cd kernel
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b v3.2.0-legacy KernelSU
          echo "obj-y += KernelSU/" >> drivers/Makefile
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu
          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -f ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          if [ -f ../susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          fi
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          
          # Injeksi langsung via Python secara aman
          python3 -c '
import os
for fpath in ["KernelSU/kernel/setuid_hook.c", "KernelSU/kernel/hook/setuid_hook.c"]:
    if os.path.exists(fpath):
        with open(fpath, "r") as f: c = f.read()
        if "#include <linux/susfs.h>" not in c:
            c = c.replace("#include \"feature/kernel_umount.h\"", "#include \"feature/kernel_umount.h\"\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif")
        if "susfs_try_umount(new_uid);" not in c:
            c = c.replace("ksu_handle_umount(old_uid, new_uid);", "#ifdef CONFIG_KSU_SUSFS\n    susfs_try_umount(new_uid);\n#endif\n    ksu_handle_umount(old_uid, new_uid);")
        with open(fpath, "w") as f: f.write(c)
        break
          '
          cd ..
          cp config/earth_defconfig kernel/arch/arm64/configs/earth_defconfig

      - name: Compile Kernel
        run: |
          cd kernel
          CLANG_DIR="$GITHUB_WORKSPACE/target-clang"
          export PATH="$CLANG_DIR/clang-r416183b/bin:$PATH"
          make O=out ARCH=arm64 earth_defconfig
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: Package Kernel with AnyKernel3
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img anykernel/
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi
          cd anykernel
          cat << 'AKEOF' > anykernel.sh
          properties() { '
          kernel.string=Redmi 12C KSU-Next + SUSFS Kernel
          do.devicecheck=1
          device.name1=earth
          device.name2=aether
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; } # end properties
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AKEOF
          zip -r9 ../Redmi12C-KSU-Next-SUSFS.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-KSU-Next-SUSFS
          path: Redmi12C-KSU-Next-SUSFS.zip
