name: Build Redmi 12C Kernel (Android 16 - KernelSU Next + suSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev libglib2.0-dev libpixman-1-dev python3 python-is-python3 git zip unzip \
            curl wget ccache libelf-dev liblz4-tool lz4 libzstd-dev patch

      - name: Setup AOSP Clang Toolchain (r522817)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -xf clang-r522817.tar.gz
          rm clang-r522817.tar.gz

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_earth $GITHUB_WORKSPACE/kernel

      - name: Setup KernelSU Next & suSFS
        run: |
          cd $GITHUB_WORKSPACE/kernel

          # 1. Pasang KernelSU Next (Branch Next)
          curl -LSs https://raw.githubusercontent.com/rifs33/KernelSU-Next/next/kernel/setup.sh | bash -s next

          # 2. Clone suSFS untuk Kernel 4.19 / Non-GKI
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu -b kernel-4.19 $GITHUB_WORKSPACE/susfs || \
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu -b gki-android12-5.10 $GITHUB_WORKSPACE/susfs

          cd $GITHUB_WORKSPACE/kernel

          # 3. Salin file pendukung suSFS ke Kernel Source
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true

          # 4. Salin patch fs
          cp -r $GITHUB_WORKSPACE/susfs/kernel_patches/fs/* fs/ 2>/dev/null || true

          # 5. Salin file integrasi suSFS langsung ke KernelSU Next
          KSU_PATH="KernelSU-Next"
          [ -d "drivers/kernelsu" ] && KSU_PATH="drivers/kernelsu"
          [ -d "KernelSU" ] && KSU_PATH="KernelSU"

          if [ -d "$KSU_PATH" ]; then
            cp -rf $GITHUB_WORKSPACE/susfs/kernel_patches/KernelSU/* $KSU_PATH/ 2>/dev/null || true
            cp -rf $GITHUB_WORKSPACE/susfs/kernel_patches/ksu/* $KSU_PATH/ 2>/dev/null || true
          fi

          # 6. Aktifkan Flag di defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/earth_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/earth_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/earth_defconfig

      - name: Build Kernel with AOSP Clang
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out earth_defconfig
          make -j$(nproc --all) O=out

      - name: Pack AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          if [ -f $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz ]; then
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image ]; then
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cd AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/Redmi12C-Kernel-KSUNext-suSFS.zip * -x .git\* README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-Kernel-KSUNext-suSFS
          path: $GITHUB_WORKSPACE/Redmi12C-Kernel-KSUNext-suSFS.zip
