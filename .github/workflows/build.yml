name: Build Redmi 12C Kernel (Latest Toolchain)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache python3 bc bison flex libssl-dev libmpath-dev \
            libelf-dev build-essential zip curl make libncurses-dev \
            lz4 libzstd-dev

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_xiaomi_earth.git kernel

      - name: Clone Latest Toolchains
        run: |
          mkdir toolchains && cd toolchains
          
          # AOSP Clang Terbaru (r522817 / Clang 18)
          git clone --depth=1 https://gitlab.com/AOSP-Clang/clang-r522817.git clang
          
          # Cross-Compiler GCC 10 Bare-Metal (64-bit & 32-bit)
          git clone --depth=1 https://github.com/Strix-KW/aarch64-elf-gcc.git -b gcc-10 gcc64
          git clone --depth=1 https://github.com/Strix-KW/arm-eabi-gcc.git -b gcc-10 gcc32

      - name: Build Kernel
        run: |
          cd kernel
          
          # Setup Path & Env
          export PATH=$(pwd)/../toolchains/clang/bin:$(pwd)/../toolchains/gcc64/bin:$(pwd)/../toolchains/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-elf-
          export CROSS_COMPILE_ARM32=arm-eabi-
          export LLVM=1
          export LLVM_IAS=1

          # Direktori Output
          mkdir -p out

          # Generate Config & Build
          make O=out earth_defconfig
          make -j$(nproc --all) O=out

      - name: Prepare Artifacts
        run: |
          cd kernel/out/arch/arm64/boot
          mkdir -p ~/artifact
          
          if [ -f Image.gz-dtb ]; then cp Image.gz-dtb ~/artifact/;
          elif [ -f Image.gz ]; then cp Image.gz ~/artifact/;
          elif [ -f Image ]; then cp Image ~/artifact/;
          fi

          if [ -f dtbo.img ]; then cp dtbo.img ~/artifact/; fi
          if [ -f dtb.img ]; then cp dtb.img ~/artifact/; fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-Kernel-Latest-Toolchain
          path: ~/artifact/*
