name: Build Redmi 12C Kernel (Android 16 - AOSP Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev libglib2.0-dev libpixman-1-dev python3 python-is-python3 git zip unzip \
            curl wget ccache libelf-dev liblz4-tool lz4 libzstd-dev patch

      - name: Setup AOSP Clang Toolchain (r522817)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -xf clang-r522817.tar.gz
          rm clang-r522817.tar.gz

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_earth $GITHUB_WORKSPACE/kernel

      - name: Setup BakaSU Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/kernel
          # 1. Pasang BakaSU ke direktori kernel
          curl -LSs https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh | bash -s main

      - name: Apply suSFS Patches over BakaSU
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu -b gki-android12-5.10 $GITHUB_WORKSPACE/susfs
          
          cd $GITHUB_WORKSPACE/kernel

          # 2. Salin header dan file C suSFS ke kernel source
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/fs/Makefile.patch fs/ 2>/dev/null || true

          # 3. Terapkan patch fs/ ke Kernel Source
          for p in $GITHUB_WORKSPACE/susfs/kernel_patches/fs/*.patch; do
            [ -f "$p" ] && patch -p1 < "$p" || true
          done

          # 4. Terapkan patch suSFS ke dalam direktori BakaSU / KernelSU
          KSU_DIR=""
          if [ -d "drivers/kernelsu" ]; then
            KSU_DIR="drivers/kernelsu"
          elif [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          fi

          if [ -n "$KSU_DIR" ]; then
            cd $GITHUB_WORKSPACE/kernel/$KSU_DIR
            for p in $GITHUB_WORKSPACE/susfs/kernel_patches/KernelSU/*.patch; do
              [ -f "$p" ] && patch -p1 < "$p" || true
            done
            for p in $GITHUB_WORKSPACE/susfs/kernel_patches/ksu/*.patch; do
              [ -f "$p" ] && patch -p1 < "$p" || true
            done
          fi

          # 5. Aktifkan Flag di defconfig
          cd $GITHUB_WORKSPACE/kernel
          echo "CONFIG_KSU=y" >> arch/arm64/configs/earth_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/earth_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/earth_defconfig

      - name: Build Kernel with AOSP Clang
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out earth_defconfig
          make -j$(nproc --all) O=out

      - name: Pack AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          if [ -f $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz ]; then
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image ]; then
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cd AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/Redmi12C-Kernel-AOSP16-BakaSU-suSFS.zip * -x .git\* README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-Kernel-AOSP16-BakaSU-suSFS
          path: $GITHUB_WORKSPACE/Redmi12C-Kernel-AOSP16-BakaSU-suSFS.zip
