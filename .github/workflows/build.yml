name: Build Redmi 12C Kernel (LineageOS 23.2 - Vanilla)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lineage-23.2

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential libncurses5-dev bison flex libssl-dev bc dwarves \
            libelf-dev libyaml-dev zip unzip python3 git

      - name: Setup Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Kernel Source (LineageOS 23.2)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_earth.git -b lineage-23.2 kernel

      - name: Setup Clang Toolchain (AOSP Clang Stable)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-14.0.0_r1 target-clang

      - name: Compile Kernel
        run: |
          cd kernel
          
          # Tentukan path Clang toolchain
          CLANG_DIR="$GITHUB_WORKSPACE/target-clang"
          export PATH="$CLANG_DIR/clang-r416183b/bin:$PATH"
          
          # Konfigurasi defconfig untuk Redmi 12C (earth)
          make O=out ARCH=arm64 earth_defconfig
          
          # Mulai proses kompilasi target Image.gz
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: Package Kernel with AnyKernel3
        run: |
          # Clone AnyKernel3
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osm0sis/AnyKernel3.git anykernel
          
          # Salin file Image.gz hasil kompilasi
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img anykernel/
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi
          
          # Kustomisasi anykernel.sh agar mendukung Redmi 12C (earth)
          cd anykernel
          sed -i 's/device.name1=/device.name1=earth/g' anykernel.sh
          sed -i 's/device.name2=/device.name2=earth_p/g' anykernel.sh
          sed -i 's/device.name3=/device.name3=22120RN86G/g' anykernel.sh
          sed -i 's/device.name4=/device.name4=22120RN86I/g' anykernel.sh
          sed -i 's/device.name5=/device.name5=22120RN86C/g' anykernel.sh
          
          # Buat archive ZIP
          zip -r9 ../Redmi12C-Kernel-Lineage23.2-Vanilla.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-Kernel-Lineage23.2-Vanilla
          path: Redmi12C-Kernel-Lineage23.2-Vanilla.zip
