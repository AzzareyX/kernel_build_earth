name: Build Redmi 12C Kernel (KernelSU Next v3.2.0-legacy + SUSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lineage-23.2

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential libncurses5-dev bison flex libssl-dev bc dwarves \
            libelf-dev libyaml-dev zip unzip python3 git curl patch

      - name: Setup Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Kernel Source (LineageOS 23.2)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_earth.git -b lineage-23.2 kernel

      - name: Setup Clang Toolchain (AOSP Clang Stable)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-14.0.0_r1 target-clang

      - name: Integrate KernelSU Next (v3.2.0-legacy) & SUSFS
        run: |
          cd kernel
          
          # 1. Clone KernelSU-Next tag v3.2.0-legacy (khusus untuk Kernel 4.19)
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b v3.2.0-legacy KernelSU
          
          # 2. Hubungkan KernelSU ke build system kernel
          echo "obj-y += KernelSU/" >> drivers/Makefile
          
          # 3. Clone SUSFS repository branch kernel-4.19
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu
          
          # 4. Salin file pendukung SUSFS ke direktori kernel
          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -f ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          if [ -f ../susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          fi
          
          # 5. Apply kernel-side patch SUSFS
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          
          # 6. Injeksi Python untuk menghubungkan KernelSU-Next dengan SUSFS
          # A. Injeksi setuid_hook.c
          python3 -c '
import os, sys
filepath = "KernelSU/kernel/setuid_hook.c"
if not os.path.exists(filepath):
    filepath = "KernelSU/kernel/hook/setuid_hook.c"

if os.path.exists(filepath):
    with open(filepath, "r") as f:
        content = f.read()
    if "#include <linux/susfs.h>" not in content:
        content = content.replace("#include \"feature/kernel_umount.h\"", "#include \"feature/kernel_umount.h\"\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif")
    if "susfs_try_umount(new_uid);" not in content:
        content = content.replace("ksu_handle_umount(old_uid, new_uid);", "#ifdef CONFIG_KSU_SUSFS\n    susfs_try_umount(new_uid);\n#endif\n    ksu_handle_umount(old_uid, new_uid);")
    with open(filepath, "w") as f:
        f.write(content)
'

          # B. Injeksi supercall.c / supercalls.c
          python3 -c '
import os, sys, re
filepath = "KernelSU/kernel/supercalls.c"
if not os.path.exists(filepath):
    filepath = "KernelSU/kernel/supercall/supercall.c"

if os.path.exists(filepath):
    with open(filepath, "r") as f:
        content = f.read()
    magic_block = """
#ifdef CONFIG_KSU_SUSFS
    if (magic2 == SUSFS_MAGIC && current_uid().val == 0) {
        switch(cmd) {
        case CMD_SUSFS_ADD_SUS_PATH:
            susfs_add_sus_path((void __user *)arg4);
            return 0;
        case CMD_SUSFS_ADD_SUS_MOUNT:
            susfs_add_sus_mount((void __user *)arg4);
            return 0;
        case CMD_SUSFS_ADD_SUS_KSTAT:
            susfs_add_sus_kstat((void __user *)arg4);
            return 0;
        case CMD_SUSFS_UPDATE_SUS_KSTAT:
            susfs_update_sus_kstat((void __user *)arg4);
            return 0;
        case CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:
            susfs_add_sus_kstat((void __user *)arg4);
            return 0;
        case CMD_SUSFS_ADD_TRY_UMOUNT:
            susfs_add_try_umount((void __user *)arg4);
            return 0;
        case CMD_SUSFS_SET_UNAME:
            susfs_set_uname((void __user *)arg4);
            return 0;
        case CMD_SUSFS_ENABLE_LOG:
            susfs_set_log(1);
            return 0;
        case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:
            susfs_set_cmdline_or_bootconfig((void __user *)arg4);
            return 0;
        case CMD_SUSFS_ADD_OPEN_REDIRECT:
            susfs_add_open_redirect((void __user *)arg4);
            return 0;
        default:
            return 0;
        }
    }
#endif // #ifdef CONFIG_KSU_SUSFS
"""
    if "SUSFS_MAGIC" not in content:
        if "uapi/supercall.h" in content:
            content = content.replace("#include \"uapi/supercall.h\"", "#include \"uapi/supercall.h\"\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0x53555346\n#endif")
        elif "#include \"ksu.h\"" in content:
            content = content.replace("#include \"ksu.h\"", "#include \"ksu.h\"\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0x53555346\n#endif")
        if "u64 reply = (u64)*arg;" in content:
            magic_block = magic_block.replace("arg4", "*arg")
        content = re.sub(r"([ \t]*)if \(magic2 == CHANGE_MANAGER_UID\) \{", magic_block + r"\n\1if (magic2 == CHANGE_MANAGER_UID) {", content)
    with open(filepath, "w") as f:
        f.write(content)
'

          # C. Injeksi selinux.c
          python3 -c '
import os, sys
filepath = "KernelSU/kernel/selinux/selinux.c"
if os.path.exists(filepath):
    with open(filepath, "r") as f:
        content = f.read()
    selinux_patch = """
#ifdef CONFIG_KSU_SUSFS
#define KERNEL_INIT_DOMAIN "u:r:init:s0"
#define KERNEL_ZYGOTE_DOMAIN "u:r:zygote:s0"
#define KERNEL_PRIV_APP_DOMAIN "u:r:priv_app:s0:c512,c768"

u32 susfs_ksu_sid __read_mostly = 0;
u32 susfs_init_sid __read_mostly = 0;
u32 susfs_zygote_sid __read_mostly = 0;
u32 susfs_priv_app_sid __read_mostly = 0;

static inline void susfs_set_sid(const char *secctx_name, u32 *out_sid)
{
    int err;
    if (!secctx_name || !out_sid) return;
    err = security_secctx_to_secid(secctx_name, strlen(secctx_name), out_sid);
    if (err) return;
}

bool susfs_is_current_zygote_domain(void) {
    return unlikely(current_sid() == susfs_zygote_sid);
}

bool susfs_is_current_ksu_domain(void) {
    return unlikely(current_sid() == susfs_ksu_sid);
}

bool susfs_is_current_init_domain(void) {
    return unlikely(current_sid() == susfs_init_sid);
}

void susfs_set_batch_sid(void)
{
    susfs_set_sid(KERNEL_ZYGOTE_DOMAIN, &susfs_zygote_sid);
    susfs_set_sid(KERNEL_SU_CONTEXT, &susfs_ksu_sid);
    susfs_set_sid(KERNEL_INIT_DOMAIN, &susfs_init_sid);
    susfs_set_sid(KERNEL_PRIV_APP_DOMAIN, &susfs_priv_app_sid);
}
#endif // CONFIG_KSU_SUSFS
"""
    if "susfs_is_current_ksu_domain" not in content:
        content += "\n" + selinux_patch
        with open(filepath, "w") as f:
            f.write(content)
'

          # D. Injeksi init.c
          python3 -c '
import os, sys, re
filepath = "KernelSU/kernel/core/init.c"
if os.path.exists(filepath):
    with open(filepath, "r") as f:
        content = f.read()
    if "susfs_set_batch_sid" not in content:
        if "#include <linux/susfs.h>" not in content:
            content = "#include <linux/susfs.h>\n" + content
        content = re.sub(r"(ksu_core_init\([^)]*\)\s*\{)", r"\1\n#ifdef CONFIG_KSU_SUSFS\n    susfs_set_batch_sid();\n#endif", content)
        with open(filepath, "w") as f:
            f.write(content)
'

          # E. Injeksi kernel_umount.c
          python3 -c '
import os, sys
filepath = "KernelSU/kernel/feature/kernel_umount.c"
if os.path.exists(filepath):
    with open(filepath, "r") as f:
        content = f.read()
    umount_patch = """
#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
void ksu_try_umount(const char *mnt, bool check_mnt, int flags, uid_t uid) {
    try_umount(mnt, flags);
}
#endif
"""
    if "ksu_try_umount" not in content:
        content += "\n" + umount_patch
        with open(filepath, "w") as f:
            f.write(content)
'

          cd ..
          cp config/earth_defconfig kernel/arch/arm64/configs/earth_defconfig

      - name: Compile Kernel
        run: |
          cd kernel
          CLANG_DIR="$GITHUB_WORKSPACE/target-clang"
          export PATH="$CLANG_DIR/clang-r416183b/bin:$PATH"
          
          make O=out ARCH=arm64 earth_defconfig
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: Package Kernel with AnyKernel3
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img anykernel/
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi
          
          cd anykernel
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Redmi 12C KSU-Next + SUSFS Kernel
          do.devicecheck=1
          device.name1=earth
          device.name2=aether
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          
          zip -r9 ../Redmi12C-KSU-Next-SUSFS.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-KSU-Next-SUSFS
          path: Redmi12C-KSU-Next-SUSFS.zip
