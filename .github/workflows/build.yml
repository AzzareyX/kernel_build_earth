name: Build Redmi 12C Kernel (LineageOS 23.2 - BakaSU + SUSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lineage-23.2

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential libncurses5-dev bison flex libssl-dev bc dwarves \
            libelf-dev libyaml-dev zip unzip python3 git curl patch

      - name: Setup Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Kernel Source (LineageOS 23.2)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_earth.git -b lineage-23.2 kernel

      - name: Setup Clang Toolchain (AOSP Clang Stable)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-14.0.0_r1 target-clang

      - name: Add BakaSU & Apply SUSFS Kernel Patches
        run: |
          # 1. Tambahkan BakaSU ke source tree kernel
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          
          # Bypass pemeriksaan inline hook BakaSU untuk Non-GKI 4.19
          if [ -f KernelSU/kernel/tools/inline_hook_check.mk ]; then
            echo "all:" > KernelSU/kernel/tools/inline_hook_check.mk
          fi

          # 2. Clone SUSFS repository branch kernel-4.19
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu
          
          # 3. Salin file pendukung SUSFS ke direktori kernel
          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -f ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          if [ -f ../susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          fi
          
          # 4. Terapkan kernel-side patch SUSFS
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          
          # 5. Fix manual untuk fungsi alloc_vfsmnt di fs/namespace.c agar sesuai dengan SUSFS 3-argumen
          if grep -q "static struct mount \*alloc_vfsmnt(const char \*name)" fs/namespace.c; then
            echo "Fixing alloc_vfsmnt function signature in fs/namespace.c..."
            sed -i 's/static struct mount \*alloc_vfsmnt(const char \*name)/static struct mount *alloc_vfsmnt(const char *name, bool should_spoof, int custom_mnt_id)/g' fs/namespace.c
          fi
          
          # 6. Fix manual untuk INODE_STATE_SUS_KSTAT di fs.h
          if ! grep -q "INODE_STATE_SUS_KSTAT" include/linux/fs.h; then
            echo "Fixing missing INODE_STATE_SUS_KSTAT definition in fs.h..."
            sed -i '/#define I_DIRTY_TIME/a \ #define INODE_STATE_SUS_KSTAT (1 << 27)' include/linux/fs.h || \
            sed -i '/#define I_DIRTY/a \ #define INODE_STATE_SUS_KSTAT (1 << 27)' include/linux/fs.h || \
            echo "#define INODE_STATE_SUS_KSTAT (1 << 27)" >> include/linux/fs.h
          fi

          cd ..
          
          # 7. Timpa file defconfig asli dengan custom defconfig dari repo Anda
          cp config/earth_defconfig kernel/arch/arm64/configs/earth_defconfig

      - name: Compile Kernel
        run: |
          cd kernel
          
          # Path Clang toolchain
          CLANG_DIR="$GITHUB_WORKSPACE/target-clang"
          export PATH="$CLANG_DIR/clang-r416183b/bin:$PATH"
          
          # Konfigurasi defconfig
          make O=out ARCH=arm64 earth_defconfig
          
          # Kompilasi kernel
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: Package Kernel with AnyKernel3
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osm0sis/AnyKernel3.git anykernel
          
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img anykernel/
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi
          
          cd anykernel
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Redmi 12C Lineage 23.2 BakaSU + SUSFS Kernel
          do.devicecheck=1
          device.name1=earth
          device.name2=aether
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_CRRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          
          zip -r9 ../Redmi12C-BakaSU-SUSFS-Kernel.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-BakaSU-SUSFS-Kernel
          path: Redmi12C-BakaSU-SUSFS-Kernel.zip
