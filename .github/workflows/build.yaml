name: Build Redmi 12C Kernel (LineageOS 23.2 - BakaSU + SUSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lineage-23.2

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential libncurses5-dev bison flex libssl-dev bc dwarves \
            libelf-dev libyaml-dev zip unzip python3 git curl patch

      - name: Setup Git Identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Kernel Source (LineageOS 23.2)
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_earth.git -b lineage-23.2 kernel

      - name: Setup Clang Toolchain (AOSP Clang Stable)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-14.0.0_r1 target-clang

      - name: Integrate BakaSU & Patch SUSFS (Kernel 4.19)
        run: |
          # 1. Jalankan skrip integrasi BakaSU
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          
          # 2. Clone Patch SUSFS khusus Kernel 4.19 dari susfs4ksu
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu
          
          # 3. Terapkan file susfs.c & susfs.h ke folder kernel/fs
          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp -f ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          
          # 4. Terapkan kernel patch SUSFS ke kernel 4.19
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          
          cd ..
          
          # 5. Timpa file defconfig asli dengan file defconfig buatan Anda yang sudah mendukung SUSFS
          cp config/earth_defconfig kernel/arch/arm64/configs/earth_defconfig

      - name: Compile Kernel
        run: |
          cd kernel
          
          # Tentukan path Clang toolchain
          CLANG_DIR="$GITHUB_WORKSPACE/target-clang"
          export PATH="$CLANG_DIR/clang-r416183b/bin:$PATH"
          
          # Konfigurasi defconfig untuk Redmi 12C (earth)
          make O=out ARCH=arm64 earth_defconfig
          
          # Mulai proses kompilasi target Image.gz
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz

      - name: Package Kernel with AnyKernel3
        run: |
          # Clone AnyKernel3
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osm0sis/AnyKernel3.git anykernel
          
          # Salin file Image.gz hasil kompilasi ke folder anykernel
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/
          
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img anykernel/
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img anykernel/
          fi
          
          # Ubah isi anykernel.sh
          cd anykernel
          cat << 'EOF' > anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Redmi 12C Lineage 23.2 BakaSU + SUSFS Kernel
          do.devicecheck=1
          device.name1=earth
          device.name2=aether
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching
          . tools/ak3-core.sh;

          # boot install
          dump_boot;
          write_boot;
          EOF
          
          # Buat archive ZIP
          zip -r9 ../Redmi12C-BakaSU-SUSFS-Kernel.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-BakaSU-SUSFS-Kernel
          path: Redmi12C-BakaSU-SUSFS-Kernel.zip
